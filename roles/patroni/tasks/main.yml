---
# =============================================================================
# patroni 역할 — Patroni 설치 및 HA PostgreSQL 클러스터 부트스트랩
# Patroni 가 PostgreSQL 을 직접 기동/승격/강등하고, etcd 에 리더 정보를 기록합니다.
# =============================================================================

# patroni_python 이 시스템 기본(python3)이 아니면 해당 인터프리터 패키지가
# 있어야 venv 를 만들 수 있습니다. RHEL 9 에서 python3.11 을 쓰는 경우가 그렇습니다.
# (같은 서버의 Airflow 등과 런타임을 맞추려는 구성)
- name: venv 용 파이썬 인터프리터 확인
  ansible.builtin.command: "{{ patroni_python }} -c 'import sys; print(sys.version)'"
  register: patroni_python_check
  changed_when: false
  failed_when: false

- name: venv 용 파이썬 설치 (없을 때만, RHEL 계열)
  ansible.builtin.package:
    name:
      - "{{ patroni_python }}"
      - "{{ patroni_python }}-pip"
    state: present
  when:
    - patroni_python_check.rc != 0
    - patroni_python != 'python3'
    - ansible_os_family == 'RedHat'

- name: 파이썬 인터프리터 사용 가능 여부 최종 확인
  ansible.builtin.command: "{{ patroni_python }} -c 'import sys; print(sys.version)'"
  register: patroni_python_final
  changed_when: false

# patroni_python 을 바꿔도 기존 venv 가 있으면 pip 모듈은 그대로 재사용합니다.
# (venv 를 다시 만들지 않으므로 파이썬 버전이 바뀌지 않습니다.)
# 그래서 버전이 어긋나면 venv 를 지워 다음 작업에서 새로 만들게 합니다.
- name: 기존 venv 의 파이썬 버전 확인
  ansible.builtin.command: "{{ patroni_venv_dir }}/bin/python -c 'import sys; print(\"%d.%d\" % sys.version_info[:2])'"
  register: patroni_venv_ver
  changed_when: false
  failed_when: false

- name: 원하는 파이썬 버전 확인
  ansible.builtin.command: "{{ patroni_python }} -c 'import sys; print(\"%d.%d\" % sys.version_info[:2])'"
  register: patroni_want_ver
  changed_when: false

- name: venv 파이썬 버전이 다르면 재생성 (서비스 중지 → 삭제)
  when:
    - patroni_venv_ver.rc == 0
    - patroni_venv_ver.stdout | trim != patroni_want_ver.stdout | trim
  block:
    - name: 재생성 사유 안내
      ansible.builtin.debug:
        msg: >-
          venv 파이썬이 {{ patroni_venv_ver.stdout | trim }} 인데
          요청은 {{ patroni_want_ver.stdout | trim }} 입니다 — venv 를 다시 만듭니다.
          (PostgreSQL 데이터에는 영향이 없으나 이 노드의 Patroni 가 잠시 내려갑니다)

    - name: Patroni 중지
      ansible.builtin.service:
        name: patroni
        state: stopped
      failed_when: false

    - name: 기존 venv 삭제
      ansible.builtin.file:
        path: "{{ patroni_venv_dir }}"
        state: absent

# 시스템 파이썬을 오염시키지 않도록 전용 가상환경(venv)에 설치합니다.
# (Debian 의 --break-system-packages 우회도 더 이상 필요 없음)
- name: Patroni 전용 가상환경(venv)에 Patroni 설치
  ansible.builtin.pip:
    name:
      - "patroni[etcd3]"     # etcd v3 API 지원 포함
      - psycopg2-binary
    state: present
    virtualenv: "{{ patroni_venv_dir }}"
    # 어떤 파이썬으로 venv 를 만들지는 patroni_python 이 정합니다.
    # 폐쇄망 번들의 wheel ABI 태그(cp39/cp311)와 반드시 일치해야 하므로
    # 값을 바꾸면 번들도 같은 버전으로 다시 만들어야 합니다.
    virtualenv_command: "{{ patroni_python }} -m venv"
    # 폐쇄망: 인터넷 대신 로컬 wheelhouse 에서 설치(--no-index --find-links).
    extra_args: >-
      {{ ('--no-index --find-links ' ~ offline_wheelhouse) if offline_mode | bool else omit }}

# 운영자가 어느 노드에서든 `patronictl` 을 바로 칠 수 있게 PATH 에 링크를 둡니다.
- name: patroni / patronictl 명령을 /usr/local/bin 에 링크
  ansible.builtin.file:
    src: "{{ patroni_venv_dir }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true              # 과거 pip 전역 설치본이 있어도 링크로 교체
  loop:
    - patroni
    - patronictl

# postgresql 역할에서 set_fact 한 값은 다른 플레이에서 사라질 수 있어 다시 계산합니다.
- name: PostgreSQL bin 디렉터리 경로 재설정(멱등)
  ansible.builtin.set_fact:
    postgresql_bin_dir: "{{ postgresql_bin_dir_deb if ansible_facts['os_family'] == 'Debian' else postgresql_bin_dir_rhel }}"

- name: Patroni 설정 디렉터리 생성
  ansible.builtin.file:
    path: "{{ patroni_config_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Patroni 로그 디렉터리 생성
  ansible.builtin.file:
    path: "{{ patroni_log_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

# ----------------------------------------------------------------------------
# 워치독(watchdog) — 리더 강등이 늦어지는 최악의 상황에서 커널이 노드를 리셋해
# split-brain 을 한 번 더 막습니다. mode=automatic 이면 장치가 없어도 무해합니다.
# ----------------------------------------------------------------------------
- name: 워치독(softdog) 설정
  when: patroni_watchdog_mode != 'off'
  block:
    - name: softdog 커널 모듈을 부팅 시 로드하도록 등록
      ansible.builtin.copy:
        content: "softdog\n"
        dest: /etc/modules-load.d/softdog.conf
        owner: root
        group: root
        mode: "0644"

    - name: softdog 커널 모듈 즉시 로드
      community.general.modprobe:
        name: softdog
        state: present
      failed_when: false     # 컨테이너 등 모듈 로드가 불가한 환경에서도 배포는 계속

    - name: /dev/watchdog 을 postgres 소유로 (udev 규칙)
      ansible.builtin.copy:
        content: 'KERNEL=="watchdog", OWNER="postgres", MODE="0600"'
        dest: /etc/udev/rules.d/99-patroni-watchdog.rules
        owner: root
        group: root
        mode: "0644"

    - name: /dev/watchdog 소유권 즉시 반영
      ansible.builtin.file:
        path: /dev/watchdog
        owner: postgres
        mode: "0600"
      failed_when: false     # 장치가 없으면 무시(automatic 모드는 경고만 남김)

- name: Patroni 설정 파일 배포
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ patroni_config_dir }}/patroni.yml"
    owner: postgres
    group: postgres
    mode: "0600"             # 비밀번호가 들어가므로 권한을 엄격히
  notify: Reload patroni

- name: Patroni systemd 유닛 배포
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart patroni

- name: Patroni 서비스 시작 및 부팅 시 자동 시작
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true
    daemon_reload: true

# Patroni 가 떠서 REST API 가 응답할 때까지 기다립니다(200=정상, 503=아직 준비중).
# 접속 자체가 안 되는 동안(status=-1)은 until 이 거짓이므로 계속 재시도합니다.
- name: Patroni REST API 응답 대기
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:{{ patroni_rest_port }}/health"
    status_code: [200, 503]
  register: patroni_health
  retries: 30
  delay: 5
  until: patroni_health.status | default(-1) in [200, 503]

# 클러스터 전체에서 리더가 한 명 선출될 때까지 기다립니다(한 번만 확인).
# /cluster 는 어느 노드에 물어봐도 전체 멤버 목록을 주므로, "이 노드가 리더가 아니면
# 영원히 기다리는" 문제 없이 재실행(멱등)에도 안전합니다.
- name: 클러스터 리더 선출 대기
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:{{ patroni_rest_port }}/cluster"
    return_content: true
  register: cluster_state
  retries: 30
  delay: 5
  until: >-
    cluster_state.status | default(-1) == 200 and
    ((cluster_state.json | default({})).members | default([])
     | selectattr('role', 'equalto', 'leader') | list | length) > 0
  run_once: true

# ----------------------------------------------------------------------------
# 현재 노드가 리더인지 판별
#   Patroni REST 의 /primary 는 리더에서만 200 을 반환합니다.
# ----------------------------------------------------------------------------
- name: 이 노드의 Patroni 역할 조회
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:{{ patroni_rest_port }}/primary"
    status_code: [200, 503]
  register: primary_check

- name: 이 노드가 리더인지 표시
  ansible.builtin.set_fact:
    patroni_is_leader: "{{ primary_check.status == 200 }}"

# ----------------------------------------------------------------------------
# 애플리케이션 사용자 / DB 생성 — 리더 노드에서만 1회 실행
#   각 노드가 patroni_is_leader 를 평가하므로, 리더가 아닌 노드는 건너뜁니다.
#   리더는 자기 자신의 PostgreSQL(127.0.0.1)에 접속해 작업합니다.
#   순서가 중요합니다: ① 사용자 먼저 만들고 → ② 그 사용자를 owner 로 DB 생성.
# ----------------------------------------------------------------------------
- name: 리더에서 애플리케이션 사용자/DB 생성
  when: patroni_is_leader | default(false)
  # community.postgresql 모듈은 대상 노드 파이썬에 psycopg2 가 필요하다.
  # 시스템 파이썬에는 없으므로, psycopg2 가 이미 설치된 Patroni venv 로 실행한다.
  vars:
    ansible_python_interpreter: "{{ patroni_venv_dir }}/bin/python"
  block:
    - name: ① 애플리케이션 사용자(role) 생성
      community.postgresql.postgresql_user:
        name: "{{ app_db_user }}"
        password: "{{ app_db_password }}"
        login_user: "{{ postgres_superuser }}"
        login_password: "{{ postgres_superuser_password }}"
        login_host: 127.0.0.1
        port: "{{ postgresql_port }}"
        state: present

    - name: ② 애플리케이션 데이터베이스 생성 (owner = 위 사용자)
      community.postgresql.postgresql_db:
        name: "{{ app_db_name }}"
        owner: "{{ app_db_user }}"          # 생성한 사용자를 DB 소유자로 등록
        encoding: UTF8
        login_user: "{{ postgres_superuser }}"
        login_password: "{{ postgres_superuser_password }}"
        login_host: 127.0.0.1
        port: "{{ postgresql_port }}"
        state: present

    - name: ③ 소유자에게 DB 전체 권한 보장
      community.postgresql.postgresql_privs:
        type: database
        database: "{{ app_db_name }}"
        roles: "{{ app_db_user }}"
        privs: ALL
        login_user: "{{ postgres_superuser }}"
        login_password: "{{ postgres_superuser_password }}"
        login_host: 127.0.0.1
        port: "{{ postgresql_port }}"
        state: present
