---
# =============================================================================
# postgresql 역할 — PostgreSQL 서버 "바이너리"만 설치합니다.
# 실제 데이터 클러스터 초기화(initdb)와 서비스 기동은 Patroni 가 담당하므로,
# 여기서는 initdb 를 하지 않고 distro 기본 서비스도 꺼 둡니다.
# =============================================================================

# ----------------------------------------------------------------------------
# Debian / Ubuntu — PGDG(PostgreSQL 공식) apt 저장소 사용
# ----------------------------------------------------------------------------
- name: PostgreSQL 설치 (Debian/Ubuntu)
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: PGDG apt 서명 키 추가
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /usr/share/keyrings/postgresql.asc
        mode: "0644"

    - name: PGDG apt 저장소 추가
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/postgresql.asc]
          http://apt.postgresql.org/pub/repos/apt {{ ansible_facts['distribution_release'] }}-pgdg main
        state: present
        filename: pgdg

    - name: PostgreSQL 패키지 설치 (Debian)
      ansible.builtin.apt:
        name:
          - "postgresql-{{ postgresql_version }}"
          - "postgresql-client-{{ postgresql_version }}"
          - "postgresql-contrib"
        state: present
        update_cache: true

    # Debian 은 설치 시 자동으로 클러스터를 만들고 서비스를 켭니다.
    # Patroni 가 클러스터를 직접 관리해야 하므로 기본 서비스를 끕니다.
    - name: distro 기본 postgresql 서비스 비활성화 (Patroni 가 관리)
      ansible.builtin.systemd:
        name: postgresql
        enabled: false
        state: stopped
      failed_when: false

    - name: 자동 생성된 기본 클러스터 제거 (Patroni 가 새로 생성)
      ansible.builtin.command: "pg_dropcluster --stop {{ postgresql_version }} main"
      args:
        removes: "/etc/postgresql/{{ postgresql_version }}/main"   # 있을 때만 실행(멱등성)

- name: PostgreSQL bin 디렉터리 경로 지정 (Debian)
  ansible.builtin.set_fact:
    postgresql_bin_dir: "{{ postgresql_bin_dir_deb }}"
  when: ansible_facts['os_family'] == 'Debian'

# ----------------------------------------------------------------------------
# RHEL / Rocky — PGDG dnf 저장소 사용
# ----------------------------------------------------------------------------
- name: PostgreSQL 설치 (RHEL/Rocky)
  when: ansible_facts['os_family'] == 'RedHat'
  vars:
    pgdg_repo_rpm_url: >-
      https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{
      ansible_facts['distribution_major_version'] }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm
  block:
    # 폐쇄망에서는 PGDG 인터넷 저장소 추가/모듈 비활성화를 건너뜁니다
    # (필요한 postgresql 패키지는 로컬 번들 저장소가 제공).
    - name: (온라인) PGDG 저장소 RPM 설치
      ansible.builtin.dnf:
        name: "{{ pgdg_repo_rpm_url }}"
        state: present
        disable_gpg_check: true
      when: not (offline_mode | bool)

    # `state: present` 는 "RPM 이 설치돼 있는가"만 봅니다. 그래서 폐쇄망 테스트
    # 등으로 /etc/yum.repos.d/pgdg-redhat-all.repo 만 지워진 노드에서는 위
    # 태스크가 조용히 통과하고, 정작 dnf 에는 PGDG 저장소가 없어 뒤의 패키지
    # 설치가 "No package postgresql16-server available" 로 실패합니다.
    # rpm -V 로 누락된 설정 파일을 감지해 복구합니다(사용자가 수정만 한
    # 경우는 'missing' 이 아니므로 건드리지 않습니다).
    - name: (온라인) PGDG 저장소 설정 파일 누락 여부 확인
      ansible.builtin.command: rpm -V pgdg-redhat-repo
      register: pgdg_repo_verify
      changed_when: false
      failed_when: false
      when: not (offline_mode | bool)

    - name: (온라인) 삭제된 PGDG 저장소 설정 파일 복구
      ansible.builtin.command: >-
        rpm -Uvh --replacepkgs --nosignature {{ pgdg_repo_rpm_url }}
      register: pgdg_repo_restore
      changed_when: pgdg_repo_restore.rc == 0
      when:
        - not (offline_mode | bool)
        - pgdg_repo_verify.stdout is defined
        - pgdg_repo_verify.stdout_lines
          | select('search', '^missing.*/etc/yum\\.repos\\.d/')
          | list | length > 0

    - name: (온라인) 내장 postgresql 모듈 비활성화 (RHEL 8/9)
      ansible.builtin.command: dnf -qy module disable postgresql
      register: pg_module_disable
      changed_when: "'Disabling' in pg_module_disable.stdout"
      when: not (offline_mode | bool)

    # postgresql_package_pin 이 설정되면 해당 "버전-릴리스" 빌드로 고정 설치한다.
    # PGDG 최신 패키지는 최신 RHEL 마이너 기준으로 빌드되어(예: *.rhel9.8 은
    # OpenSSL 3.4 요구) 오래된 마이너(예: 9.4)에서는 의존성 해결이 실패할 수 있다.
    - name: PostgreSQL 패키지 설치 (RHEL)
      ansible.builtin.dnf:
        name:
          - "postgresql{{ postgresql_version }}-server{{ ('-' ~ postgresql_package_pin) if postgresql_package_pin else '' }}"
          - "postgresql{{ postgresql_version }}-contrib{{ ('-' ~ postgresql_package_pin) if postgresql_package_pin else '' }}"
        state: present
        disablerepo: "{{ '*' if (offline_mode | bool and offline_repo_exclusive | bool) else omit }}"
        enablerepo: "{{ offline_repo_name if offline_mode | bool else omit }}"

- name: PostgreSQL bin 디렉터리 경로 지정 (RHEL)
  ansible.builtin.set_fact:
    postgresql_bin_dir: "{{ postgresql_bin_dir_rhel }}"
  when: ansible_facts['os_family'] == 'RedHat'

# ----------------------------------------------------------------------------
# 공통 — 사용자 / 디렉터리 준비
# ----------------------------------------------------------------------------
- name: 데이터 디렉터리 상위 폴더를 postgres 소유로
  ansible.builtin.file:
    path: "{{ postgresql_data_dir | dirname }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: PostgreSQL 데이터 디렉터리 생성
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"                  # PostgreSQL 은 데이터 디렉터리 권한을 엄격히 요구

- name: postgres 사용자 PATH 에 PostgreSQL bin 추가
  ansible.builtin.lineinfile:
    path: /var/lib/postgresql/.bashrc
    line: "export PATH={{ postgresql_bin_dir }}:$PATH"
    create: true
    owner: postgres
    group: postgres
    mode: "0644"
  when: ansible_facts['os_family'] == 'Debian'
