---
# =============================================================================
# common 역할 — 모든 노드에 공통으로 필요한 기본 설정
# (패키지 설치, 시간 동기화, 호스트 이름 등록, 커널 파라미터 조정)
# =============================================================================

- name: OS 패키지 계열 판별(Debian/RedHat)
  ansible.builtin.set_fact:
    is_debian: "{{ ansible_facts['os_family'] == 'Debian' }}"
    is_redhat: "{{ ansible_facts['os_family'] == 'RedHat' }}"

- name: 시간대 설정 ({{ system_timezone }})
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: 기본 패키지 설치 (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv         # Patroni 전용 가상환경 생성에 필요
      - python3-psycopg2     # Ansible 의 PostgreSQL 모듈이 사용
      - acl                  # become_user 전환 시 파일 권한 처리에 필요
      - curl
      - gnupg
      - ca-certificates
      - chrony               # 시간 동기화(클러스터에 매우 중요)
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: is_debian

- name: 기본 패키지 설치 (RHEL/Rocky)
  ansible.builtin.dnf:
    name:
      - python3-pip
      - python3-psycopg2
      - acl
      - chrony
    state: present
    # 폐쇄망: 시스템 저장소를 모두 끄고 로컬 번들 저장소만 사용
    disablerepo: "{{ '*' if (offline_mode | bool and offline_repo_exclusive | bool) else omit }}"
    enablerepo: "{{ offline_repo_name if offline_mode | bool else omit }}"
  when: is_redhat

# 노드 간 시간이 어긋나면 복제·리더 선출에 문제가 생기므로 시간 동기화는 필수입니다.
- name: 시간 동기화(chrony) 실행 및 부팅 시 자동 시작
  ansible.builtin.service:
    name: "{{ 'chrony' if is_debian else 'chronyd' }}"
    state: started
    enabled: true

# 노드들이 호스트 이름으로 서로를 찾을 수 있도록 /etc/hosts 에 등록합니다.
- name: /etc/hosts 에 클러스터 구성원 등록 (etcd + db 모두)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "\\s{{ item }}$"
    line: "{{ hostvars[item].node_ip }} {{ item }}"
    state: present
  loop: "{{ (groups['etcd'] + groups['patroni_cluster']) | unique }}"

# PostgreSQL 운영에 권장되는 커널 파라미터를 적용합니다.
- name: PostgreSQL 권장 커널 파라미터 적용 (sysctl)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: "vm.overcommit_memory", value: "2" }     # 메모리 과다 할당 방지
    - { name: "vm.swappiness", value: "1" }            # 스왑 사용 최소화
    - { name: "net.ipv4.tcp_keepalive_time", value: "300" }   # 죽은 연결 빠른 정리

# ----------------------------------------------------------------------------
# 방화벽 자동 개방 (configure_firewall=true 일 때)
#   RHEL 9 는 firewalld 가 기본 활성이라, 포트를 열지 않으면 etcd 정족수 형성부터
#   실패합니다. 노드가 속한 그룹(역할)에 맞는 포트만 골라서 엽니다.
#   방화벽을 직접 관리한다면 group_vars 에서 configure_firewall: false 로 끄세요.
# ----------------------------------------------------------------------------
- name: 이 노드에서 개방할 포트 계산 (소속 그룹 기준)
  ansible.builtin.set_fact:
    node_firewall_ports: >-
      {{ (([etcd_client_port, etcd_peer_port]
             if inventory_hostname in (groups['etcd'] | default([])) else [])
        + ([postgresql_port, patroni_rest_port]
             if inventory_hostname in (groups['patroni_cluster'] | default([])) else [])
        + ([pgbouncer_port]
             if inventory_hostname in (groups['pgbouncer'] | default([])) else [])
        + ([haproxy_primary_port, haproxy_replica_port, haproxy_stats_port]
             if inventory_hostname in (groups['haproxy'] | default([])) else []))
        | map('int') | list }}
  when: configure_firewall | bool

- name: 서비스 상태 수집 (firewalld 활성 여부 확인용, RHEL)
  ansible.builtin.service_facts:
  when: configure_firewall | bool and is_redhat

- name: 방화벽 포트 개방 (firewalld)
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ node_firewall_ports }}"
  when:
    - configure_firewall | bool
    - is_redhat
    - (ansible_facts.services['firewalld.service'].state | default('')) == 'running'

# Keepalived 노드끼리는 VRRP(프로토콜 112)로 VIP 소유권을 주고받습니다.
- name: VRRP 프로토콜 허용 (firewalld, haproxy 노드)
  ansible.posix.firewalld:
    protocol: vrrp
    permanent: true
    immediate: true
    state: enabled
  when:
    - configure_firewall | bool
    - is_redhat
    - (ansible_facts.services['firewalld.service'].state | default('')) == 'running'
    - inventory_hostname in (groups['haproxy'] | default([]))

- name: ufw 활성 여부 확인 (Debian)
  ansible.builtin.command: ufw status
  register: ufw_state
  changed_when: false
  failed_when: false
  when: configure_firewall | bool and is_debian

# ufw 는 VRRP 프로토콜 규칙을 지원하지 않습니다. Debian 에서 ufw 를 쓰면서
# keepalived 를 함께 쓴다면 VRRP(224.0.0.18) 허용 규칙은 직접 추가해야 합니다.
- name: 방화벽 포트 개방 (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ node_firewall_ports }}"
  when:
    - configure_firewall | bool
    - is_debian
    - "'Status: active' in (ufw_state.stdout | default(''))"
